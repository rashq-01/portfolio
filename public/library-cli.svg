<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d12"/>
      <stop offset="50%" stop-color="#0e131b"/>
      <stop offset="100%" stop-color="#070a0e"/>
    </linearGradient>
    <linearGradient id="termBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="50%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="500" rx="14" fill="url(#bgGrad)"/>
  <rect x="0.5" y="0.5" width="799" height="499" rx="13.5" fill="none" stroke="url(#termBorder)" stroke-width="1.5"/>

  <!-- Window Header -->
  <rect x="0" y="0" width="800" height="42" rx="14" fill="#111827" fill-opacity="0.9"/>
  <rect x="0" y="41" width="800" height="1" fill="#1f2937"/>

  <!-- Window Controls -->
  <circle cx="22" cy="21" r="6" fill="#ef4444"/>
  <circle cx="42" cy="21" r="6" fill="#f59e0b"/>
  <circle cx="62" cy="21" r="6" fill="#10b981"/>

  <!-- Window Title -->
  <text x="400" y="26" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500" text-anchor="middle">
    cpp-library-cli &mdash; rajesh@arch-sys &mdash; g++ -std=c++20 -O3
  </text>

  <!-- Terminal Content -->
  <g font-family="'JetBrains Mono', 'Courier New', monospace" font-size="13.5" xml:space="preserve">
    <!-- Command Prompt -->
    <text x="28" y="76" fill="#10b981" font-weight="600">rajesh@arch-sys</text>
    <text x="145" y="76" fill="#6b7280">:</text>
    <text x="155" y="76" fill="#3b82f6">~/projects/library-cli</text>
    <text x="340" y="76" fill="#f3f4f6">$ ./bin/library_core --persistence=binary</text>

    <!-- Init lines -->
    <text x="28" y="108" fill="#6b7280">[INIT]</text>
    <text x="80" y="108" fill="#d1d5db">Mounting binary persistence buffer: <tspan fill="#60a5fa">/var/data/catalog.dat</tspan></text>
    <text x="590" y="108" fill="#34d399">[OK]</text>

    <text x="28" y="132" fill="#6b7280">[BTREE]</text>
    <text x="88" y="132" fill="#d1d5db">Indexed 2,840 records into memory &bull; lookup latency <tspan fill="#fbbf24">0.00012s</tspan></text>

    <!-- Banner Frame -->
    <text x="28" y="172" fill="#4b5563">&#x250C;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2510;</text>
    <text x="28" y="194" fill="#4b5563">&#x2502;</text>
    <text x="180" y="194" fill="#f9fafb" font-weight="700">LIBRA-CORE v2.4 &mdash; C++20 Systems Architecture</text>
    <text x="735" y="194" fill="#4b5563">&#x2502;</text>
    <text x="28" y="216" fill="#4b5563">&#x2514;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2518;</text>

    <!-- Menu Items -->
    <text x="50" y="252" fill="#a78bfa" font-weight="600">[1]</text>
    <text x="80" y="252" fill="#e5e7eb">Query Catalog Index <tspan fill="#9ca3af">(Binary Search &bull; O(log N))</tspan></text>

    <text x="50" y="278" fill="#a78bfa" font-weight="600">[2]</text>
    <text x="80" y="278" fill="#e5e7eb">Circulation Issue/Return Engine</text>

    <text x="50" y="304" fill="#a78bfa" font-weight="600">[3]</text>
    <text x="80" y="304" fill="#e5e7eb">RBAC Member Permissions &amp; Audit Log</text>

    <text x="50" y="330" fill="#a78bfa" font-weight="600">[4]</text>
    <text x="80" y="330" fill="#e5e7eb">Flush Disk Cache &amp; Run fsync() Verification</text>

    <text x="50" y="356" fill="#a78bfa" font-weight="600">[5]</text>
    <text x="80" y="356" fill="#e5e7eb">Memory Diagnostics &amp; Valgrind Leak Check</text>

    <!-- Execution log -->
    <text x="28" y="398" fill="#60a5fa">&gt; EXECUTE:</text>
    <text x="110" y="398" fill="#f3f4f6">Option [2] &rarr; Issue Book #8192 to Member #104</text>

    <text x="28" y="424" fill="#34d399">[SUCCESS]</text>
    <text x="110" y="424" fill="#9ca3af">Atomic transaction written &bull; Memory buffer committed to disk (0.00008s)</text>

    <!-- Prompt cursor -->
    <text x="28" y="458" fill="#10b981" font-weight="600">libra-cli&gt;</text>
    <rect x="115" y="445" width="8" height="16" fill="#10b981">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>

